syntax = "proto3";
option go_package = "bs/pb";
package pb;

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";

service Bookstore {
  //返回书店中所有书架的列表
  rpc ListShelves(google.protobuf.Empty) returns(ListShelvesResponse){
    option (google.api.http) = {
      get: "/v1/shelves"
    };
  };
  //在书店中创建一个新书架
  rpc CreateShelf(CreateShelfRequest) returns(CreateShelfResponse){
    option (google.api.http) = {
      post: "/v1/shelves"
      body:"shelf"
    };
  };
  //返回书店中指定ID的书架
  rpc GetShelf(GetShelfRequest) returns(GetShelfResponse){
    option (google.api.http) = {
      get: "/v1/shelves/{id}"
    };
  }
  //删除书架，包括书架上存储的所有图书
  rpc DeleteShelf(DeleteShelfRequest) returns(google.protobuf.Empty){
    option (google.api.http) = {
      delete: "/v1/shelves/{id}"
    };
  }
  //返回书架上的图书列表
  rpc ListBooks(ListBooksRequest) returns(ListBooksResponse){
    option (google.api.http) = {
      get: "/v1/shelves/{id}/books"
    };
  }
  //创建一本图书
  rpc CreateBook(CreateBookRequest)returns(CreateBookResponse){
    option (google.api.http) = {
        post:"/v1/shelves/{id}/books"
        body:"book"
    };
  }
  //返回指定图书
  rpc GetBook(GetBookRequest)returns(GetBookResponse){
    option(google.api.http)={
        get:"/v1/shelves/{shelfid}/books/{bookid}"
    };
  }
  //从书架上删除一本图书
  rpc DeleteBook(DeleteBookRequest)returns(google.protobuf.Empty){
    option (google.api.http) = {
      delete: "/v1/shelves/{shelfid}/books/{bookid}"
    };
  }
}

message Shelf {
    int64 id=1;
    string theme=2;
    int64 size=3;
}

message Book {
    int64 id=1;
    string author=2;
    string title = 3;
}

message ListShelvesResponse {
    repeated Shelf shelf=1;
}

message CreateShelfRequest {
    Shelf shelf = 1;
}

message CreateShelfResponse {
    Shelf shelf = 1;
}

message GetShelfRequest {
    int64 id = 1;
}

message GetShelfResponse {
    Shelf shelf = 1;
}

message DeleteShelfRequest {
    int64 id = 1;
}

message ListBooksRequest {
    int64 id = 1;
}
message ListBooksResponse {
    repeated Book books=1;
}

message CreateBookRequest {
    int64 id = 1;
    Book book = 2;
}

message CreateBookResponse {
    Book book = 1;
}

message GetBookRequest {
    int64 shelfid=1;
    int64 bookid=2;
}

message GetBookResponse{
    Book book=1;
}

message DeleteBookRequest {
    int64 shelfid=1;
    int64 bookid=2;
}
